<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark tile background -->
  <rect width="512" height="512" rx="128" fill="#09090b" />

  <!-- Outer subtle gradient stroke -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-opacity="0.9" />

  <!-- Subtle inner gradient glow / accent -->
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.25" />

  <!-- Code brackets & Monogram AA -->
  <!-- Left bracket < -->
  <path d="M 120 180 L 60 256 L 120 332" fill="none" stroke="url(#brandGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Right bracket > -->
  <path d="M 392 180 L 452 256 L 392 332" fill="none" stroke="url(#brandGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Center Monogram "AA" -->
  <text 
    x="256" 
    y="312" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="168" 
    letter-spacing="-6"
  >AA</text>
</svg>